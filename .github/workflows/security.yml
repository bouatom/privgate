# Security scanning — Track 4 gate. Two independent checks ensure no vulnerable
# dependency and no hardcoded secret ships:
#   * npm-audit — full dependency tree (runtime AND dev tooling) fails on any
#                 high/critical advisory. Complements the production-only gate
#                 in the installer workflows' `verify` job, which directly blocks
#                 the installers this pipeline ships.
#   * secrets   — gitleaks scans git history for hardcoded secrets before merge.
# 
# Note: CodeQL static analysis is handled by GitHub's **default setup**
# (enabled in repository Settings > Code security & analysis > Code scanning).
# Advanced CodeQL workflows conflict with the default setup; this workflow
# intentionally omits an explicit CodeQL job.

name: Security scan

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "agent/**"
      - "packaging/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "agent/**"
      - "packaging/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/security.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIVGATE_NODE_VERSION: "22.15.1"

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Full-tree hard gate: catches high/critical advisories in BOTH runtime and
      # dev dependencies (build tooling, linters, test runners) that the
      # production-only gate in the installer workflows intentionally skips.
      # `npm ci` reused setup-node's npm cache, so this reuses the same install.
      # Fails the job on any high/critical advisory; a red job is meant to block
      # the merge via branch protection.
      - name: Audit all dependencies (high/critical gate)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks-action posts inline PR comments on leaks
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so a secret that was committed then removed in a later
          # commit is still caught (it remains in the git objects).
          fetch-depth: 0

      # gitleaks scans git history for hardcoded credentials (API keys, tokens,
      # passwords, private keys) and fails the build on any finding. No license is
      # required for this personal repo (GITLEAKS_LICENSE is only for organization
      # accounts) and none is passed here.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
