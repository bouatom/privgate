# Publish the Windows Elevation Broker (net48). This is not a WPF/WinForms
# or MSIX packaging project — the GitHub ".NET Core Desktop" template does
# not apply here.

name: Windows broker

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/dotnet-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/dotnet-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Elevation Broker
        run: |
          set -euo pipefail
          dotnet publish agent/PrivGate.Agent.csproj -c Release -f net48 -o agent/dist
          dotnet publish agent/helper/PrivGate.Helper.csproj -c Release -f net48 -o agent/dist
          test -f agent/dist/PrivGate.Agent.exe
          test -f agent/dist/PrivGate.Helper.exe
          ls -lh agent/dist/*.exe

      - name: Upload broker binaries
        uses: actions/upload-artifact@v4
        with:
          name: privgate-agent
          path: |
            agent/dist/PrivGate.Agent.exe
            agent/dist/PrivGate.Helper.exe
          if-no-files-found: error
