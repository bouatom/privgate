# Build management-console installers (Windows EXE/MSI, Linux deb, macOS pkg)
# and attach each file to a GitHub Release together with a sha256sums.txt
# manifest. Builds PrivGate-Client.msi once (Ubuntu + msitools/wixl) and ships
# it inside every console payload so Devices can brand it without runtime wixl.
# A parser-only gate syntax-checks every *.ps1 under scripts/ and packaging/;
# those scripts are parsed, never executed.

name: Console installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "agent/**"
      - "scripts/smoke-agent-build.sh"
      - "packaging/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/dotnet-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "agent/**"
      - "scripts/smoke-agent-build.sh"
      - "packaging/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/dotnet-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIVGATE_NODE_VERSION: "22.15.1"
  PRIVGATE_SKIP_TARBALL: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      release_tag: ${{ steps.set.outputs.release_tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: set
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "release_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Test, typecheck, lint
        run: npm test && npm run typecheck && npm run lint

  pwsh-syntax:
    name: PowerShell syntax gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Parser-only gate: every .ps1 under scripts/ and packaging/ is fed to
      # [System.Management.Automation.Language.Parser]::ParseFile so syntax
      # errors fail the build. Nothing is ever executed — dev Macs have no
      # pwsh, so this is the only place these files get checked.
      - name: Parse every .ps1 (never execute)
        run: |
          set -euo pipefail
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find scripts packaging -type f -name '*.ps1' | LC_ALL=C sort)
          echo "Found ${#scripts[@]} PowerShell script(s) to parse:"
          printf '  %s\n' "${scripts[@]}"
          status=0
          for script in "${scripts[@]}"; do
            echo "::group::Parser::ParseFile ${script}"
            pwsh -NoProfile -Command '
              & {
                param([string]$Path)
                $tokens = $null
                $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $Path, [ref]$tokens, [ref]$errors) | Out-Null
                if ($errors -and $errors.Count -gt 0) {
                  foreach ($e in $errors) {
                    Write-Output ("::error file={0},line={1},col={2}::{3}" -f $Path, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
                  }
                  exit 1
                }
                Write-Output "parse OK: $Path"
              }' "$script" || status=1
            echo "::endgroup::"
          done
          if [[ "$status" -ne 0 ]]; then
            echo "PowerShell parse errors found; failing the build." >&2
          fi
          exit "$status"

  client-msi:
    name: Client MSI
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVGATE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install msitools and wixl
        run: |
          sudo apt-get update
          # Ubuntu splits the source: msitools is inspect/extract; wixl builds MSIs.
          sudo apt-get install -y --no-install-recommends msitools wixl
          command -v wixl
          wixl --version

      - name: Publish Windows client
        run: bash scripts/smoke-agent-build.sh

      - name: Build PrivGate-Client.msi
        run: |
          set -euo pipefail
          node packaging/windows/build-client-msi.cjs \
            agent/dist \
            agent/dist/PrivGate-Client.msi \
            "${PRIVGATE_VERSION}"
          test -f agent/dist/PrivGate-Client.msi

      - name: Upload client MSI
        uses: actions/upload-artifact@v7
        with:
          # Keep this a zip named client-msi. archive: false ignores `name` and
          # publishes the file as PrivGate-Client.msi, which download cannot find.
          name: client-msi
          path: agent/dist/PrivGate-Client.msi
          if-no-files-found: error

  installers:
    name: ${{ matrix.name }} installer
    needs: [version, verify, client-msi, pwsh-syntax]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: ubuntu-latest
            target: windows
          - name: Linux
            runner: ubuntu-latest
            target: linux
          - name: macOS
            runner: macos-latest
            target: macos
    env:
      PRIVGATE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Windows packaging tools
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis msitools wixl

      - name: Install npm dependencies
        run: npm ci

      - name: Download client MSI
        uses: actions/download-artifact@v8
        with:
          name: client-msi
          path: dist/client-msi

      - name: Build ${{ matrix.name }} installer
        env:
          PRIVGATE_TARGETS: ${{ matrix.target }}
        run: |
          test -f dist/client-msi/PrivGate-Client.msi
          bash packaging/build.sh

      - name: Upload Windows EXE
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/installers/PrivGate-Console-${{ env.PRIVGATE_VERSION }}-win-x64.exe
          if-no-files-found: error

      - name: Upload Windows MSI
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/installers/PrivGate-Console-${{ env.PRIVGATE_VERSION }}-win-x64.msi
          # A missing console MSI must fail the build, not publish an EXE-only release.
          if-no-files-found: error

      - name: Upload Linux deb
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/installers/privgate-console_${{ env.PRIVGATE_VERSION }}_amd64.deb
          if-no-files-found: error

      - name: Upload macOS pkg
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/installers/PrivGate-Console-${{ env.PRIVGATE_VERSION }}-macos-*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, installers]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      # update-server.sh/.ps1 auto-verify a sha256sums.txt beside the installer,
      # so the manifest must exist on every release. Generated here — the only
      # place all released installers are collected — over exactly the files
      # that ship, using coreutils format "<64-hex>  <relative-name>" (two
      # spaces). The optional Linux tar.gz is included when present; the
      # standalone client MSI never ships, so it gets no entry.
      - name: Generate sha256sums.txt
        run: |
          set -euo pipefail
          mkdir -p checksums
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          found=0
          has_exe=0 has_msi=0 has_pkg=0 has_deb=0
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              PrivGate-Console-*.exe|PrivGate-Console-*-win-x64.msi|PrivGate-Console-*-macos-*.pkg|privgate-console_*_amd64.deb|PrivGate-Console-*-linux-x64.tar.gz)
                (cd release-files && sha256sum -- "$base") >> "$tmp"
                case "$base" in
                  *.exe) has_exe=1 ;;
                  *.msi) has_msi=1 ;;
                  *.pkg) has_pkg=1 ;;
                  *.deb) has_deb=1 ;;
                esac
                found=$((found + 1))
                ;;
              *)
                echo "Not part of the checksum manifest: $base" >&2
                ;;
            esac
          done < <(find release-files -type f -print0)
          if [[ ${found} -eq 0 ]]; then
            echo "No installer artifacts found under release-files/" >&2
            exit 1
          fi
          # Mirror of the release assertion below: a partial manifest must not
          # ship, because updaters verify each downloaded file against it.
          if [[ "$has_exe" -ne 1 || "$has_msi" -ne 1 || "$has_pkg" -ne 1 || "$has_deb" -ne 1 ]]; then
            echo "Manifest must cover Windows EXE+MSI, macOS pkg, and Linux deb; matched only ${found} file(s):" >&2
            ls -la release-files >&2 || true
            exit 1
          fi
          LC_ALL=C sort -o checksums/sha256sums.txt "$tmp"
          echo "== checksums/sha256sums.txt =="
          cat checksums/sha256sums.txt
          # Round-trip check proves the manifest parses in standard format.
          (cd release-files && sha256sum --check --strict ../checksums/sha256sums.txt)

      - name: Upload sha256sums.txt artifact
        uses: actions/upload-artifact@v7
        with:
          name: sha256sums
          path: checksums/sha256sums.txt
          if-no-files-found: error

      - name: Publish release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          has_win=0
          has_win_msi=0
          has_mac=0
          has_lin=0
          while IFS= read -r -d '' f; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            case "$base" in
              PrivGate-Console-*.exe)
                files+=("$f")
                has_win=1
                ;;
              PrivGate-Console-*.msi)
                files+=("$f")
                has_win_msi=1
                ;;
              PrivGate-Client.msi)
                echo "Skipping standalone client MSI (shipped inside consoles): $base" >&2
                ;;
              PrivGate-Console-*.pkg)
                files+=("$f")
                has_mac=1
                ;;
              privgate-console_*.deb)
                files+=("$f")
                has_lin=1
                ;;
              sha256sums.txt)
                # Regenerated below; also guards job re-runs where the earlier
                # sha256sums artifact lands in release-files via merge-multiple.
                echo "Skipping checksum manifest (published separately): $base" >&2
                ;;
              *)
                echo "Refusing to publish archive or client binary: $base" >&2
                exit 1
                ;;
            esac
          done < <(find release-files -type f -print0)
          # The win-x64 MSI assertion is deliberate: Devices hands that file to
          # Intune/SCCM, and an EXE-only release silently breaks them.
          if [[ ${#files[@]} -eq 0 || "$has_win" -ne 1 || "$has_win_msi" -ne 1 || "$has_mac" -ne 1 || "$has_lin" -ne 1 ]]; then
            echo "Need one Windows EXE, one Windows MSI, one macOS, and one Linux installer; found:" >&2
            ls -la release-files >&2 || true
            exit 1
          fi
          ls -lh "${files[@]}"

          # Ship the checksum manifest beside the installers it covers.
          files+=("checksums/sha256sums.txt")

          notes="Management console installers from ${GITHUB_SHA}.

          | OS | Installer |
          | --- | --- |
          | Windows | \`PrivGate-Console-${VERSION}-win-x64.exe\` (recommended) or \`.msi\` |
          | macOS | \`PrivGate-Console-${VERSION}-macos-*.pkg\` |
          | Linux amd64 | \`privgate-console_${VERSION}_amd64.deb\` |
          | Checksums | \`sha256sums.txt\` (SHA-256; verify with \`sha256sum -c\`) |

          Open http://127.0.0.1:3000/ after install. There is no demo login.
          Enroll each PC from **Devices** after the console is up."

          if [[ "$PRERELEASE" == "true" ]]; then
            title="PrivGate Console ${VERSION} (nightly)"
            extra=(--prerelease --latest=false --notes "$notes")
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              "${extra[@]}"
          else
            title="PrivGate Console ${VERSION}"
            extra=(--latest --notes "$notes")
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
              gh release edit "$RELEASE_TAG" --title "$title" --target "$GITHUB_SHA" --notes "$notes"
            else
              gh release create "$RELEASE_TAG" "${files[@]}" \
                --title "$title" \
                --target "$GITHUB_SHA" \
                "${extra[@]}"
            fi
          fi
